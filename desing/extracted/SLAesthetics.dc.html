<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="font-family:'Heebo',sans-serif;color:#1C1C1C;background:#FFFFFF">
  <sc-if value="{{ isOverview }}" hint-placeholder-val="{{ true }}">
    <section style="padding:0">
    <div style="position:relative;color:#1C1C1C;background:radial-gradient(ellipse 70% 90% at 50% 0%,#F5EEE7 0%,rgba(245,238,231,.55) 45%,#FFFFFF 100%)">
      
      <div style="padding:clamp(132px,15vw,196px) clamp(20px,4.5vw,64px) clamp(64px,8vw,112px)">
        <div style="max-width:860px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px">
          <span data-reveal="0" style="display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;letter-spacing:.04em;color:#7A573C"><span aria-hidden="true" style="width:5px;height:5px;border-radius:50%;background:#8F6A4B"></span>טיפולי אסתטיקה<span aria-hidden="true" style="width:5px;height:5px;border-radius:50%;background:#8F6A4B"></span></span>
          <h1 data-reveal="80" style="margin:0;font-family:'Heebo',sans-serif;font-weight:200;font-size:clamp(44px,6.4vw,96px);line-height:1.02;letter-spacing:-.04em;text-wrap:balance;color:#1C1C1C">אסתטיקה מתקדמת, בדיוק אישי.</h1>
          <p data-reveal="160" style="margin:0;font-size:clamp(15px,1.2vw,17px);line-height:1.75;color:#5A5A5A;max-width:540px;text-wrap:pretty">טכנולוגיות מתקדמות לטיפוח העור והגוף, עם אותה הקפדה ואותו יחס אישי.</p>
        </div>
      </div>
    </div>
  </section>
    <section style="padding:0 clamp(16px,4vw,48px) clamp(56px,8vw,112px)">
      <div style="max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px">
        <sc-for list="{{ items }}" as="t" hint-placeholder-count="3">
          <article data-reveal="0" style="border-top:1px solid rgba(28,28,28,.14);padding:clamp(24px,3vw,40px) 0 0;display:flex;flex-wrap:wrap;flex-direction:{{ t.dir }};gap:clamp(24px,4vw,56px);align-items:center">
            <div style="position:relative;border-radius:24px;overflow:hidden;background:#F2EBE4;color:#999999;flex:1.2 1 380px;min-width:0;aspect-ratio:16/11"><image-slot id="{{ t.slot }}" shape="rounded" radius="24" placeholder="{{ t.ph }}"></image-slot></div>
            <div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:clamp(4px,2vw,24px)">
              <h2 style="margin:0;font-family:'Heebo',sans-serif;font-size:clamp(36px,4.6vw,68px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;font-size:clamp(28px,3vw,42px);font-weight:200">{{ t.title }}</h2>
              <p style="margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.75;color:#5A5A5A;text-wrap:pretty;font-size:16px;max-width:440px">{{ t.short }}</p>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button onClick="{{ t.open }}" style="height:52px;padding:0 28px;border-radius:999px;border:0;background:#8F6A4B;color:#FFFFFF;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none;transition:background .3s" style-hover="background:#6E4F37;color:#FFFFFF">למידע נוסף<span aria-hidden="true">←</span></button>
                <a href="{{ t.wa }}" target="_blank" rel="noopener" style="height:52px;padding:0 26px;border-radius:999px;border:1px solid rgba(28,28,28,.2);background:transparent;color:#1C1C1C;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none;transition:background .3s;background:#FFFFFF" style-hover="background:#FFFFFF;color:#1C1C1C">ייעוץ ללא עלות</a>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
  </sc-if>
  <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
    <section style="padding:clamp(100px,12vh,120px) clamp(16px,4vw,48px) clamp(40px,6vw,72px)">
      <div style="max-width:1240px;margin:0 auto">
        <button onClick="{{ back }}" style="height:40px;padding:0 16px;border-radius:999px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .3s, color .3s;background:#F7F5F2;color:#1C1C1C;margin-bottom:28px">→ כל טיפולי האסתטיקה</button>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,72px);align-items:center">
          <div style="display:flex;flex-direction:column;gap:24px">
            <h1 data-reveal="0" style="margin:0;font-family:'Heebo',sans-serif;font-size:clamp(44px,6.2vw,92px);line-height:1;letter-spacing:-.035em;text-wrap:balance;font-size:clamp(40px,5.4vw,76px);font-weight:200">{{ d.title }}</h1>
            <p data-reveal="80" style="margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.75;color:#5A5A5A;text-wrap:pretty;max-width:460px">{{ d.short }}</p>
            <a data-reveal="160" href="{{ d.wa }}" target="_blank" rel="noopener" style="height:52px;padding:0 28px;border-radius:999px;border:0;background:#8F6A4B;color:#FFFFFF;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none;transition:background .3s;align-self:flex-start" style-hover="background:#6E4F37;color:#FFFFFF">לתיאום ייעוץ ללא עלות<span aria-hidden="true">←</span></a>
          </div>
          <div data-reveal="80" style="position:relative;border-radius:24px;overflow:hidden;background:#F2EBE4;color:#999999;border-radius:220px 220px 28px 28px;aspect-ratio:4/5;max-height:70vh"><image-slot id="{{ d.slot }}" shape="rounded" radius="32" placeholder="{{ d.ph }}"></image-slot></div>
        </div>
      </div>
    </section>
    <section style="padding:clamp(56px,8vw,112px) clamp(16px,4vw,48px)">
      <div style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px">
        <sc-for list="{{ d.blocks }}" as="b" hint-placeholder-count="3">
          <div data-reveal="{{ b.delay }}" style="border-top:1px solid rgba(28,28,28,.14);padding:22px 0 0;display:flex;flex-direction:column;gap:10px">
            <span style="font-size:13px;font-weight:500;color:#8F6A4B">{{ b.n }}</span>
            <h2 style="margin:0;font-weight:300;font-size:clamp(21px,1.9vw,26px);line-height:1.3;letter-spacing:-.01em;margin-top:14px">{{ b.t }}</h2>
            <p style="margin:0;font-size:15px;line-height:1.7;color:#5A5A5A">{{ b.d }}</p>
          </div>
        </sc-for>
      </div>
    </section>
    <section style="padding:clamp(56px,8vw,112px) clamp(16px,4vw,48px)">
      <div style="max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:28px">
        <h2 data-reveal="0" style="margin:0;font-family:'Heebo',sans-serif;font-size:clamp(36px,4.6vw,68px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;text-align:center;font-weight:200">שאלות ותשובות</h2>
        <dc-import name="SLFaq" items="{{ d.faq }}" hint-size="100%,320px"></dc-import>
      </div>
    </section>
    <section style="padding:clamp(56px,8vw,112px) clamp(16px,4vw,48px);padding-bottom:clamp(40px,5vw,64px)">
      <div style="max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px">
        <span style="font-size:14px;color:#8A8A8A">טיפולים נוספים</span>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px">
          <sc-for list="{{ others }}" as="o" hint-placeholder-count="2">
            <button onClick="{{ o.open }}" style="display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:88px;padding:20px 0;border-radius:0;border:0;border-top:1px solid rgba(28,28,28,.14);background:transparent;color:#1C1C1C;text-align:right;cursor:pointer;font-size:18px;transition:background .3s" style-hover="background:#EFEBE5">{{ o.title }}<span style="font-size:13px;font-weight:500;color:#8F6A4B;flex:none">←</span></button>
          </sc-for>
        </div>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = [
  { id: 'laser', en: 'LASER HAIR REMOVAL', title: 'הסרת שיער בלייזר', ph: 'הסרת שיער בלייזר',
    short: 'טיפול להפחתת שיער לא רצוי באזורים שונים בגוף, בסדרת מפגשים ובהתאמה לסוג העור והשיער.',
    blocks: [['מה זה', 'אנרגיית אור ממוקדת המכוונת לזקיק השערה. הטיפול נעשה בסדרה, משום שהשיער צומח במחזורים.'],
      ['למי זה מתאים', 'ההתאמה תלויה בגוון העור, בצבע השיער ובעובי השערה. היא נבדקת באופן אישי לפני תחילת התהליך.'],
      ['מה לצפות', 'מספר המפגשים והמרווחים ביניהם משתנים מאישה לאישה. שיר תבנה איתך תוכנית ותעדכן אותה לאורך הדרך.']],
    faq: [{ q: 'כמה מפגשים נדרשים?', a: 'אין מספר קבוע. ההערכה נעשית בייעוץ ומתעדכנת לפי התגובה לטיפול.' }, { q: 'האם יש הכנה מיוחדת?', a: 'כן, תקבלי הנחיות הכנה מפורטות לפני המפגש הראשון.' }, { q: 'אפשר לטפל בכל עונה?', a: 'ניתן לטפל לאורך השנה, תוך הקפדה על הנחיות חשיפה לשמש.' }] },
  { id: 'firming', en: 'SKIN FIRMING', title: 'מיצוק העור', ph: 'טיפול מיצוק',
    short: 'טיפולים מתקדמים התומכים במראה עור מוצק וחיוני יותר, בהתאמה לצורכי העור שלך.',
    blocks: [['מה זה', 'טיפולים לא פולשניים הפועלים על שכבות העור, במטרה לשפר את מראה המוצקות והגמישות.'],
      ['למי זה מתאים', 'למי שמרגישה שהעור איבד מעט מגמישותו ומחפשת דרך עדינה לטפל בכך. ההתאמה נקבעת בייעוץ.'],
      ['מה לצפות', 'השינוי הדרגתי ומשתנה מאישה לאישה. בדרך כלל מומלץ על סדרת טיפולים, בהתאם להערכה האישית.']],
    faq: [{ q: 'מתי רואים שינוי?', a: 'השינוי הדרגתי ותלוי בעור ובתגובה לטיפול. שיר תתאם איתך ציפיות מראש.' }, { q: 'האם יש זמן החלמה?', a: 'ברוב המקרים ניתן לחזור לשגרה מיד. פרטים מדויקים יינתנו בייעוץ.' }] },
  { id: 'tightening', en: 'SKIN TIGHTENING', title: 'מתיחת העור וטכנולוגיות מתקדמות', ph: 'טכנולוגיות אסתטיות',
    short: 'טכנולוגיות אסתטיות לשיפור מראה המרקם והקווים, בגישה זהירה ומותאמת אישית.',
    blocks: [['מה זה', 'מגוון טכנולוגיות לשיפור מראה העור. הבחירה בטכנולוגיה נעשית לפי מטרת הטיפול ומאפייני העור.'],
      ['למי זה מתאים', 'לנשים המחפשות שיפור במראה המרקם או הקווים, בלי הליך פולשני. ההתאמה נבדקת באופן אישי.'],
      ['מה לצפות', 'תוכנית אישית עם תיאום ציפיות כן. התוצאות משתנות ואינן מובטחות מראש.']],
    faq: [{ q: 'איך בוחרים את הטיפול הנכון?', a: 'בשיחת הייעוץ בוחנים את העור והמטרות, ושיר ממליצה על הכיוון המתאים.' }, { q: 'אפשר לשלב עם טיפולים אחרים?', a: 'לעיתים כן. ההמלצה ניתנת באופן אישי.' }] }
];
class Component extends DCLogic {
  renderVals() {
    const app = this.props.app || { wa: () => '#', go() {}, param: null };
    const open = id => () => app.go('aesthetics', id);
    const cur = T.find(t => t.id === app.param);
    const wa = t => app.wa(`היי שיר, אשמח לייעוץ ללא עלות לגבי ${t.title}.`);
    return {
      isOverview: !cur, isDetail: !!cur,
      items: T.map((t, i) => ({ ...t, n: String(i + 1).padStart(2, '0'), slot: 'aes-' + t.id, dir: i % 2 ? 'row-reverse' : 'row', open: open(t.id), wa: wa(t) })),
      d: cur ? { ...cur, slot: 'aes-' + cur.id + '-detail', wa: wa(cur), blocks: cur.blocks.map(([t, d2], i) => ({ n: String(i + 1).padStart(2, '0'), t, d: d2, delay: i * 100 })) }
             : { title: '', en: '', short: '', blocks: [], faq: [], slot: 'x', ph: '', wa: '#' },
      others: T.filter(t => t !== cur).map(t => ({ title: t.title, open: open(t.id) })),
      back: () => app.go('aesthetics')
    };
  }
}
</script>
</body>
</html>
