<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="font-family:'Heebo',sans-serif;color:#1C1C1C;background:#FFFFFF">
  <section data-screen-label="Shop · Hero" style="padding:0">
    <div style="position:relative;color:#1C1C1C;background:radial-gradient(ellipse 70% 90% at 50% 0%,#F5EEE7 0%,rgba(245,238,231,.55) 45%,#FFFFFF 100%)">
      <div style="padding:clamp(132px,15vw,196px) clamp(20px,4.5vw,64px) clamp(48px,6vw,80px)">
        <div style="max-width:860px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px">
          <span data-reveal="0" style="display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;letter-spacing:.04em;color:#7A573C"><span aria-hidden="true" style="width:5px;height:5px;border-radius:50%;background:#8F6A4B"></span>החנות של שיר לביא<span aria-hidden="true" style="width:5px;height:5px;border-radius:50%;background:#8F6A4B"></span></span>
          <h1 data-reveal="80" style="margin:0;font-family:'Heebo',sans-serif;font-weight:200;font-size:clamp(44px,6.4vw,96px);line-height:1.02;letter-spacing:-.04em;text-wrap:balance;color:#1C1C1C">טיפוח שממשיך הביתה.</h1>
          <p data-reveal="160" style="margin:0;font-size:clamp(15px,1.2vw,17px);line-height:1.75;color:#5A5A5A;max-width:540px;text-wrap:pretty">מוצרים שנבחרו בקליניקה, לשגרת טיפוח שממשיכה את הטיפול גם בבית.</p>
          <div data-reveal="240" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px">
            <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
              <button onClick="{{ c.jump }}" style="height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(28,28,28,.14);background:#FFFFFF;color:#1C1C1C;font-size:14px;cursor:pointer;white-space:nowrap;flex:none;transition:background .3s,border-color .3s,color .3s" style-hover="background:#8F6A4B;border-color:#8F6A4B;color:#FFFFFF">{{ c.label }}</button>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section data-screen-label="Shop · Best sellers" style="padding:clamp(24px,4vw,48px) clamp(16px,4vw,48px) 0">
    <div style="max-width:1240px;margin:0 auto">
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(24px,3vw,36px)">
        <span data-reveal="0" style="display:block;border-top:1px solid rgba(28,28,28,.14);padding-top:16px;font-size:13px;font-weight:500;color:#7A573C">הנמכרים ביותר</span>
        <h2 data-reveal="60" style="margin:0;font-family:'Heebo',sans-serif;font-size:clamp(28px,3vw,42px);line-height:1.05;letter-spacing:-.03em;font-weight:200">האהובים של הלקוחות</h2>
      </div>
      <div style="display:grid;grid-auto-flow:column;grid-auto-columns:minmax(min(72vw,280px),1fr);gap:clamp(12px,1.6vw,20px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none">
        <sc-for list="{{ best }}" as="p" hint-placeholder-count="3">
          <div data-reveal="{{ p.delay }}" style="scroll-snap-align:start;min-width:0"><dc-import name="SLProductCard" product="{{ p }}" app="{{ app }}" hint-size="100%,460px"></dc-import></div>
        </sc-for>
      </div>
    </div>
  </section>

  <section ref="{{ gridRef }}" data-screen-label="Shop · All products" style="padding:clamp(64px,8vw,112px) clamp(16px,4vw,48px) clamp(48px,6vw,80px)">
    <div style="max-width:1240px;margin:0 auto">
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(20px,3vw,32px)">
        <span data-reveal="0" style="display:block;border-top:1px solid rgba(28,28,28,.14);padding-top:16px;font-size:13px;font-weight:500;color:#7A573C">קטלוג</span>
        <h2 data-reveal="60" style="margin:0;font-family:'Heebo',sans-serif;font-size:clamp(28px,3vw,42px);line-height:1.05;letter-spacing:-.03em;font-weight:200">כל המוצרים</h2>
      </div>
      <div style="position:sticky;top:84px;z-index:10;margin:0 calc(-1 * clamp(16px,4vw,48px)) clamp(24px,3vw,36px);padding:10px clamp(16px,4vw,48px);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(28,28,28,.08)">
        <div style="max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
          <div role="tablist" aria-label="קטגוריות" style="display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0">
            <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
              <button role="tab" aria-selected="{{ c.on }}" onClick="{{ c.pick }}" style="height:44px;padding:0;border:0;border-bottom:1.5px solid {{ c.under }};background:transparent;font-size:14px;font-weight:{{ c.weight }};cursor:pointer;white-space:nowrap;transition:color .3s,border-color .3s;flex:none;color:{{ c.color }}" style-hover="color:#1C1C1C">{{ c.label }}</button>
            </sc-for>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0">
            <label style="flex:1 1 180px;width:220px;max-width:100%;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:#F7F5F2">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="#5A5A5A" stroke-width="1.3"></circle><path d="M11 11l3.5 3.5" stroke="#5A5A5A" stroke-width="1.3" stroke-linecap="round"></path></svg>
              <input type="search" value="{{ q }}" onChange="{{ onQ }}" placeholder="חיפוש מוצר" aria-label="חיפוש מוצר" style="flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:#1C1C1C;outline:none;height:42px;font-family:inherit">
            </label>
            <select value="{{ sort }}" onChange="{{ onSort }}" aria-label="מיון" style="height:44px;padding:0 16px;border-radius:999px;border:0;background:#F7F5F2;font-size:14px;color:#1C1C1C;cursor:pointer;outline:none;font-family:inherit">
              <option value="rec">מומלצים</option><option value="new">חדשים</option><option value="low">מחיר: מהנמוך</option><option value="high">מחיר: מהגבוה</option>
            </select>
          </div>
        </div>
      </div>
      <div style="font-size:13px;color:#8A8A8A;margin-bottom:18px">{{ countLabel }}</div>
      <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax({{ cardMin }},1fr));gap:clamp(36px,4vw,56px) clamp(12px,1.6vw,20px)">
          <sc-for list="{{ list }}" as="p" hint-placeholder-count="8">
            <div style="min-width:0"><dc-import name="SLProductCard" product="{{ p }}" app="{{ app }}" hint-size="100%,420px"></dc-import></div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="border-top:1px solid rgba(28,28,28,.1);border-bottom:1px solid rgba(28,28,28,.1);padding:72px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
          <span style="font-size:24px;font-weight:200;letter-spacing:-.02em">לא נמצאו מוצרים</span>
          <span style="font-size:15px;color:#5A5A5A">נסי חיפוש או קטגוריה אחרת.</span>
          <button onClick="{{ clear }}" style="height:48px;padding:0 26px;border-radius:999px;border:0;background:#8F6A4B;color:#FFFFFF;font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;transition:background .3s" style-hover="background:#6E4F37;color:#FFFFFF">ניקוי הסינון</button>
        </div>
      </sc-if>
      <div style="margin-top:28px;font-size:12px;color:#8A8A8A">המוצרים, המחירים והתמונות הם דוגמאות לעיצוב בלבד.</div>
    </div>
  </section>

  <section data-screen-label="Shop · Perks" style="padding:0 clamp(16px,4vw,48px) clamp(56px,7vw,96px)">
    <div style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));column-gap:clamp(24px,4vw,56px)">
      <sc-for list="{{ perks }}" as="k" hint-placeholder-count="3">
        <div style="border-top:1px solid rgba(28,28,28,.14);padding:20px 0;display:flex;flex-direction:column;gap:6px"><span style="font-size:17px;font-weight:400">{{ k.t }}</span><span style="font-size:14px;line-height:1.6;color:#5A5A5A">{{ k.d }}</span></div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'all', q: '', sort: 'rec' };
  gridRef = React.createRef();
  renderVals() {
    const app = this.props.app || { products: [], mobile: false, openProduct() {} };
    const P = app.products || [];
    const { cat, q, sort } = this.state;
    const CATS = [['all', 'הכל'], ['aftercare', 'טיפוח לאחר טיפול'], ['skin', 'טיפוח העור'], ['sets', 'ערכות'], ['tools', 'כלים ואביזרים']];
    let list = P.filter(p => (cat === 'all' || p.cat === cat) && (!q.trim() || (p.name + ' ' + p.catName + ' ' + p.short).includes(q.trim())));
    const sorters = { rec: (a, b) => a.rank - b.rank, new: (a, b) => (b.isNew - a.isNew) || a.rank - b.rank, low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price };
    list = list.slice().sort(sorters[sort]);
    const feature = P.find(p => p.id === 'home-ritual') || { name: '', short: '', priceLabel: '' };
    return {
      app, gridRef: this.gridRef,
      heroRatio: app.mobile ? '4/5' : '21/9',
      cardMin: app.mobile ? '150px' : '260px',
      best: P.filter(p => p.best).map((p, i) => ({ ...p, delay: i * 100 })),
      feature, openFeature: () => app.openProduct(feature.id),
      cats: CATS.map(([k, label]) => ({ label, on: cat === k, under: cat === k ? '#8F6A4B' : 'transparent', weight: cat === k ? 500 : 400, color: cat === k ? '#1C1C1C' : '#6B6B6B', pick: () => this.setState({ cat: k }),
        jump: () => { this.setState({ cat: k }); const el = this.gridRef.current; if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' }); } })),
      q, onQ: e => this.setState({ q: e.target.value }),
      sort, onSort: e => this.setState({ sort: e.target.value }),
      list, hasResults: list.length > 0, noResults: list.length === 0,
      countLabel: list.length === 1 ? 'מוצר אחד' : list.length + ' מוצרים',
      clear: () => this.setState({ cat: 'all', q: '' }),
      perks: [
        { en: 'DELIVERY', t: 'משלוח לכל הארץ', d: 'זמני ועלויות המשלוח יוצגו בקופה.' },
        { en: 'SECURE', t: 'תשלום מאובטח', d: 'כרטיס אשראי ו־Apple Pay במכשירים תומכים.' },
        { en: 'PERSONAL', t: 'ייעוץ אישי', d: 'לא בטוחה מה מתאים לך? כתבי לנו.' }
      ]
    };
  }
}
</script>
</body>
</html>
