<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="font-family:'Heebo',sans-serif;color:#1C1C1C;background:#FFFFFF">
  <section data-screen-label="Contact" style="padding:clamp(100px,12vh,120px) clamp(16px,4vw,48px) clamp(48px,6vw,80px)">
    <div style="max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(32px,4vw,56px)">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:20px">
        <div style="align-self:stretch;width:100%;display:flex;flex-direction:column;gap:22px"><div data-reveal="0" style="align-self:stretch;width:100%"><span style="align-self:stretch;display:block;border-top:1px solid rgba(28,28,28,.14);padding-top:16px;font-size:13px;font-weight:500;color:#7A573C">יצירת קשר</span></div><h1 data-reveal="80" style="margin:0;font-family:'Heebo',sans-serif;font-size:clamp(44px,6.2vw,92px);line-height:1;letter-spacing:-.035em;text-wrap:balance;font-weight:200">בואי נדבר.</h1></div>
        <p data-reveal="160" style="margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.75;color:#5A5A5A;text-wrap:pretty;max-width:380px">הדרך המהירה ביותר היא וואטסאפ. שיר עונה באופן אישי לכל פנייה.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px">
        <sc-for list="{{ quick }}" as="q" hint-placeholder-count="3">
          <a data-reveal="{{ q.delay }}" href="{{ q.href }}" target="_blank" rel="noopener" style="border-radius:24px;background:#F7F5F2;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:8px;color:#1C1C1C;min-height:170px;transition:background .3s" style-hover="background:#F5EEE7;color:#1C1C1C">
            <span style="font-size:18px;font-weight:500">{{ q.t }}</span>
            <span style="font-size:14px;color:#5A5A5A">{{ q.d }}</span>
            <span style="margin-top:auto;align-self:flex-start;height:36px;padding:0 14px;border-radius:999px;background:#FFFFFF;font-size:13px;display:flex;align-items:center;gap:8px">וואטסאפ<span aria-hidden="true">←</span></span>
          </a>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px;align-items:start">
        <div style="border-radius:28px;background:#FFFFFF;border:1px solid rgba(41,37,34,.08);padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:22px">
          <h2 style="margin:0;font-family:'Heebo',sans-serif;font-size:clamp(36px,4.6vw,68px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;font-size:clamp(24px,2.4vw,32px);font-weight:200">או השאירי פרטים</h2>
          <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
            <div ref="{{ okRef }}" role="status" style="border-radius:20px;background:#F7F5F2;padding:28px;display:flex;flex-direction:column;gap:10px;align-items:flex-start">
              <span style="font-size:22px;font-weight:500">תודה, {{ firstName }}.</span>
              <span style="font-size:15px;line-height:1.7;color:#5A5A5A">הפנייה התקבלה. שיר תחזור אלייך בהקדם.</span>
              <span style="font-size:12px;color:#8A8A8A">תצוגת עיצוב: חיבור הטופס יושלם בשלב הפיתוח.</span>
              <button onClick="{{ reset }}" style="height:52px;padding:0 26px;border-radius:999px;border:1px solid rgba(28,28,28,.2);background:transparent;color:#1C1C1C;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none;transition:background .3s;height:42px;background:#FFFFFF;margin-top:6px" style-hover="background:#FFFFFF;color:#1C1C1C">פנייה נוספת</button>
            </div>
          </sc-if>
          <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
            <form onSubmit="{{ submit }}" noValidate="" style="display:flex;flex-direction:column;gap:16px">
              <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
                <label style="display:flex;flex-direction:column;gap:6px">
                  <span style="font-size:13px;color:#5A5A5A">{{ f.label }}</span>
                  <input name="{{ f.name }}" type="{{ f.type }}" value="{{ f.value }}" onChange="{{ f.change }}" autoComplete="{{ f.ac }}" inputMode="{{ f.im }}" aria-invalid="{{ f.bad }}" style="height:52px;border-radius:14px;border:1px solid {{ f.line }};background:#FFFFFF;padding:0 16px;font-size:16px;color:#1C1C1C;outline:none;width:100%;background:#FFFFFF" style-focus="border-color:#1C1C1C">
                  <sc-if value="{{ f.bad }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#A0442E">{{ f.err }}</span></sc-if>
                </label>
              </sc-for>
              <div style="display:flex;flex-direction:column;gap:8px">
                <span style="font-size:13px;color:#5A5A5A">נושא</span>
                <div style="display:flex;flex-wrap:wrap;gap:6px">
                  <sc-for list="{{ topics }}" as="t" hint-placeholder-count="5">
                    <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="height:40px;padding:0 16px;border-radius:999px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .3s, color .3s;background:{{ t.bg }};color:{{ t.color }}">{{ t.label }}</button>
                  </sc-for>
                </div>
              </div>
              <label style="display:flex;flex-direction:column;gap:6px">
                <span style="font-size:13px;color:#5A5A5A">הודעה (לא חובה)</span>
                <textarea name="msg" rows="3" value="{{ msg }}" onChange="{{ msgChange }}" style="border-radius:14px;border:1px solid rgba(41,37,34,.12);background:#FFFFFF;font-size:16px;line-height:1.6;color:#1C1C1C;padding:12px 16px;outline:none;resize:vertical" style-focus="border-color:#1C1C1C"></textarea>
              </label>
              <button type="submit" style="height:52px;padding:0 28px;border-radius:999px;border:0;background:#8F6A4B;color:#FFFFFF;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none;transition:background .3s;align-self:flex-start;padding:0 36px" style-hover="background:#6E4F37;color:#FFFFFF">שליחה</button>
            </form>
          </sc-if>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div data-reveal="0" style="position:relative;border-radius:24px;overflow:hidden;background:#F2EBE4;color:#999999;border-radius:28px;aspect-ratio:4/3"><image-slot id="contact-clinic" shape="rounded" radius="28" placeholder="צילום הקליניקה"></image-slot></div>
          <div style="border-radius:28px;background:#F7F5F2;padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;gap:4px">
            <sc-for list="{{ info }}" as="i" hint-placeholder-count="5">
              <div style="display:flex;justify-content:space-between;gap:16px;padding:10px 4px;font-size:15px"><span style="color:#5A5A5A">{{ i.k }}</span><span>{{ i.v }}</span></div>
            </sc-for>
            <div style="display:flex;gap:6px;margin-top:10px">
              <a href="#" style="height:40px;padding:0 16px;border-radius:999px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .3s, color .3s;height:36px;font-size:13px;background:#FFFFFF;display:flex;align-items:center">Instagram</a>
              <a href="#" style="height:40px;padding:0 16px;border-radius:999px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .3s, color .3s;height:36px;font-size:13px;background:#FFFFFF;display:flex;align-items:center">Facebook</a>
              <a href="#" style="height:40px;padding:0 16px;border-radius:999px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .3s, color .3s;height:36px;font-size:13px;background:#FFFFFF;display:flex;align-items:center">TikTok</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: '', phone: '', email: '', msg: '', topic: 'brows', tried: false, sent: false };
  okRef = React.createRef();
  componentDidUpdate() {
    const ps = this._prev || {}; this._prev = { ...this.state }; if (this.state.sent && !ps.sent && this.okRef.current) this.okRef.current.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 600, easing: 'cubic-bezier(.16,.8,.2,1)' }); }
  renderVals() {
    const app = this.props.app || { wa: () => '#' };
    const s = this.state;
    const errs = {
      name: s.name.trim().length < 2 ? 'נא למלא שם מלא' : '',
      phone: !/^0\d{8,9}$/.test(s.phone.replace(/[\s-]/g, '')) ? 'נא למלא מספר טלפון תקין' : '',
      email: s.email && !/^\S+@\S+\.\S+$/.test(s.email) ? 'כתובת האימייל אינה תקינה' : ''
    };
    const F = [['name', 'שם מלא', 'text', 'name', 'text'], ['phone', 'טלפון', 'tel', 'tel', 'tel'], ['email', 'אימייל (לא חובה)', 'email', 'email', 'email']];
    const TOP = [['brows', 'טיפולי גבות'], ['removal', 'הסרת איפור קבוע'], ['aesthetics', 'אסתטיקה'], ['academy', 'האקדמיה'], ['shop', 'הזמנה מהחנות']];
    return {
      sent: s.sent, notSent: !s.sent, okRef: this.okRef, firstName: s.name.trim().split(' ')[0],
      quick: [
        { en: 'TREATMENTS', t: 'ייעוץ לטיפול', d: 'גבות, הסרה או אסתטיקה', href: app.wa('היי שיר, אשמח לתאם ייעוץ ללא עלות לטיפול.') },
        { en: 'ACADEMY', t: 'פרטים על האקדמיה', d: 'מסלולי לימוד ומחזורים', href: app.wa('היי שיר, אשמח לפרטים על האקדמיה.') },
        { en: 'SHOP', t: 'שאלה על הזמנה', d: 'מוצרים, משלוחים והחזרות', href: app.wa('היי, יש לי שאלה לגבי הזמנה מהחנות.') }
      ].map((q, i) => ({ ...q, delay: i * 100 })),
      fields: F.map(([k, label, type, ac, im]) => ({
        name: k, label, type, ac, im, value: s[k], err: errs[k], bad: s.tried && !!errs[k],
        line: s.tried && errs[k] ? '#A0442E' : 'rgba(41,37,34,.12)',
        change: e => this.setState({ [k]: e.target.value })
      })),
      topics: TOP.map(([k, label]) => { const on = s.topic === k; return { label, on, border: 'transparent', bg: on ? '#1C1C1C' : '#F7F5F2', color: on ? '#FFFFFF' : '#1C1C1C', pick: () => this.setState({ topic: k }) }; }),
      msg: s.msg, msgChange: e => this.setState({ msg: e.target.value }),
      submit: e => { e.preventDefault(); if (Object.values(errs).some(Boolean)) this.setState({ tried: true }); else this.setState({ sent: true }); },
      reset: () => this.setState({ name: '', phone: '', email: '', msg: '', tried: false, sent: false }),
      info: [{ k: 'הקליניקה', v: 'קליניקת בוטיק לנשים בלבד' }, { k: 'כתובת', v: '[כתובת הקליניקה]' }, { k: 'שעות', v: '[שעות פעילות]' }, { k: 'טלפון', v: '[מספר טלפון]' }, { k: 'אימייל', v: '[כתובת אימייל]' }]
    };
  }
}
</script>
</body>
</html>
