<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="display:flex;flex-direction:column;gap:12px;font-family:'Heebo',sans-serif">
  <div ref="{{ boxRef }}" style="position:relative;width:100%;aspect-ratio:{{ ratio }};border-radius:24px;background:#F2EBE4;color:#999999;overflow:hidden;user-select:none">
    <div style="position:absolute;inset:0"><image-slot id="{{ beforeId }}" shape="rect" placeholder="לפני"></image-slot></div>
    <div style="position:absolute;inset:0;background:#EAE6E0;clip-path:{{ clip }}"><image-slot id="{{ afterId }}" shape="rect" placeholder="אחרי"></image-slot></div>
    <span style="position:absolute;top:14px;right:14px;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.9);font-size:13px;display:flex;align-items:center;color:#1C1C1C;pointer-events:none">לפני</span>
    <span style="position:absolute;top:14px;left:14px;height:30px;padding:0 12px;border-radius:999px;background:rgba(41,37,34,.85);font-size:13px;display:flex;align-items:center;color:#FFFFFF;pointer-events:none">אחרי</span>
    <div role="slider" tabindex="0" aria-label="השוואת לפני ואחרי" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pos }}" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onKeyDown="{{ key }}" style="position:absolute;top:0;bottom:0;left:{{ left }};width:56px;margin-left:-28px;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center;outline:none">
      <div style="position:absolute;top:0;bottom:0;left:27px;width:2px;background:rgba(255,255,255,.9)"></div>
      <div style="position:relative;width:44px;height:44px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:5px;color:#1C1C1C;box-shadow:0 4px 16px rgba(41,37,34,.15)">
        <svg width="6" height="10" viewBox="0 0 6 10" fill="none"><path d="M5 1L1 5l4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <svg width="6" height="10" viewBox="0 0 6 10" fill="none"><path d="M1 1l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </div>
  </div>
  <sc-if value="{{ hasCaption }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 6px">
      <span style="font-size:16px;font-weight:500;color:#1C1C1C">{{ caption }}</span>
      <span style="font-size:13px;color:#8A8A8A">{{ note }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:600},&quot;sid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;cmp&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ratio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4/5&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { pos: 50 };
  boxRef = React.createRef();
  setFrom(e) {
    const r = this.boxRef.current.getBoundingClientRect();
    const p = Math.max(3, Math.min(97, ((e.clientX - r.left) / r.width) * 100));
    this.setState({ pos: p });
  }
  renderVals() {
    const pos = this.state.pos;
    const sid = this.props.sid ?? 'cmp';
    return {
      pos: Math.round(pos),
      left: pos + '%',
      clip: `inset(0 ${100 - pos}% 0 0)`,
      ratio: this.props.ratio ?? '4/5',
      beforeId: sid + '-before',
      afterId: sid + '-after',
      caption: this.props.caption ?? '',
      note: this.props.note ?? '',
      hasCaption: !!this.props.caption,
      down: e => { e.currentTarget.setPointerCapture(e.pointerId); this.drag = true; this.setFrom(e); },
      move: e => { if (this.drag) this.setFrom(e); },
      up: () => { this.drag = false; },
      key: e => {
        if (e.key === 'ArrowLeft') this.setState(s => ({ pos: Math.max(3, s.pos - 4) }));
        if (e.key === 'ArrowRight') this.setState(s => ({ pos: Math.min(97, s.pos + 4) }));
      }
    };
  }
}
</script>
</body>
</html>
