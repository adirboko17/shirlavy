<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A47B58">
<title>SHIR LAVY — Aesthetics &amp; Academy</title>
<meta name="description" content="SHIR LAVY Aesthetics &amp; Academy — האתר החדש בדרך.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300&amp;family=Assistant:wght@300;400;600&amp;family=Marcellus&amp;display=swap">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#A47B58"></rect><text x="50" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#F0DCA4">SL</text></svg></template>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#A47B58;color:#F6EBD6;font-family:'Assistant',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#F6EBD6;text-decoration:none}
a:hover{color:#FFFFFF}
@keyframes slUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slFade{from{opacity:0}to{opacity:1}}
@keyframes slGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.9}50%{transform:translate(-46%,-53%) scale(1.12);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<main dir="rtl" data-bg="gradient" lang="he" style="position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(28px,5vh,56px) 28px calc(clamp(28px,5vh,56px) + env(safe-area-inset-bottom));gap:32px;background:radial-gradient(55% 45% at 50% 38%, rgba(240,214,160,.28) 0%, rgba(240,214,160,0) 70%), radial-gradient(70% 60% at 85% 100%, rgba(120,82,54,.45) 0%, rgba(120,82,54,0) 70%), radial-gradient(60% 55% at 10% 0%, rgba(196,154,110,.5) 0%, rgba(196,154,110,0) 70%), linear-gradient(165deg, #B08862 0%, #A47B58 45%, #93694B 100%);text-align:center">
  

  <div aria-hidden="true" style="position:absolute;top:40%;left:50%;width:min(120vw,1100px);aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle, rgba(246,224,176,.22) 0%, rgba(246,224,176,0) 62%);transform:translate(-50%,-50%);pointer-events:none;animation:slGlow 14s ease-in-out infinite"></div>
  <span></span>
  <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(26px,4.5vh,44px);max-width:580px">
    <img src="assets/logo-foil.png" alt="SHIR LAVY — Aesthetics &amp; Academy" style="width:clamp(230px,32vw,290px);height:auto;filter:drop-shadow(0 1px 0 rgba(90,60,35,.35));animation:slUp 1.4s cubic-bezier(.16,.8,.2,1) both">
    <div style="width:56px;height:1px;background:linear-gradient(90deg,transparent,#E6CD93,transparent);animation:slUp 1.4s .25s cubic-bezier(.16,.8,.2,1) both"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;animation:slUp 1.4s .4s cubic-bezier(.16,.8,.2,1) both">
      <h1 style="margin:0;font-family:'Heebo',sans-serif;font-weight:200;font-size:clamp(34px,5vw,54px);line-height:1.15;letter-spacing:-.01em;color:#FFF6E4;text-shadow:0 1px 0 rgba(90,60,35,.25)">האתר החדש בדרך</h1>
      <p style="margin:0;font-size:clamp(16px,1.6vw,18px);line-height:1.75;font-weight:300;color:#F6EBD6;max-width:400px;text-wrap:balance">אנחנו עובדות על בית דיגיטלי חדש לקליניקה, לאקדמיה ולחנות. בינתיים, נשמח לדבר איתך בוואטסאפ.</p>
    </div>
    <a href="{{ wa }}" target="_blank" rel="noopener" style="height:54px;padding:0 32px;border-radius:999px;background:linear-gradient(135deg,#F3E2B0,#D9B871 55%,#EBD49B);color:#3E2A1C;font-size:15px;font-weight:600;display:flex;align-items:center;box-shadow:0 6px 20px rgba(70,45,25,.22);transition:transform .3s, box-shadow .3s;animation:slUp 1.4s .55s cubic-bezier(.16,.8,.2,1) both" style-hover="transform:translateY(-1px);box-shadow:0 10px 26px rgba(70,45,25,.3);color:#3E2A1C">לתיאום ייעוץ בוואטסאפ</a>
  </div>
  <footer style="position:relative;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#F1E2C6;animation:slUp 1.4s .7s cubic-bezier(.16,.8,.2,1) both">
    <span>קליניקת בוטיק לנשים · אקדמיה לאיפור קבוע</span>
    <span dir="ltr" style="font-family:'Marcellus',serif;letter-spacing:.24em;font-size:11px;color:#EED8A6">© SHIR LAVY</span>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;972500000000&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.phone ?? '972500000000').replace(/\D/g, '');
    return { wa: `https://wa.me/${phone}?text=${encodeURIComponent('היי שיר, אשמח לתאם שיחת ייעוץ.')}` };
  }
}
</script>
</body>
</html>
