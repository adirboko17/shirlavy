<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&amp;display=swap">
<script src="./image-slot.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#FFFFFF;color:#1F1A1C;font-family:'Rubik',sans-serif}a{color:#1F1A1C;text-decoration:none}a:hover{color:#8E5A63}</style>
</helmet>
<div dir="rtl" style="background:#FFFFFF;color:#1F1A1C;font-family:'Rubik',sans-serif;min-height:100vh;padding:14px">
  <div style="max-width:1360px;margin:0 auto;border-radius:32px;background:#F8EEEE;overflow:hidden">
    <header style="height:80px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:20px">
      <div dir="ltr" style="display:flex;align-items:center;gap:10px"><img src="assets/monogram-gold.png" alt="" style="width:30px;height:30px"><img src="assets/name-ink.png" alt="SHIR LAVY" style="height:13px"></div>
      <nav style="display:flex;gap:6px;padding:5px;border-radius:999px;background:#FFFFFF;font-size:14px;flex-wrap:wrap">
        <span style="height:36px;padding:0 14px;border-radius:999px;background:#1F1A1C;color:#FFFFFF;display:flex;align-items:center">ראשי</span><span style="height:36px;padding:0 14px;display:flex;align-items:center">טיפולים</span><span style="height:36px;padding:0 14px;display:flex;align-items:center">האקדמיה</span><span style="height:36px;padding:0 14px;display:flex;align-items:center">חנות</span>
      </nav>
      <a href="#" style="height:44px;padding:0 20px;border-radius:999px;background:#1F1A1C;color:#FFFFFF;font-size:14px;display:flex;align-items:center">ייעוץ ללא עלות</a>
    </header>
    <section style="padding:40px 28px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:center">
      <div style="display:flex;flex-direction:column;gap:26px;padding:0 12px">
        <h1 style="margin:0;font-weight:300;font-size:clamp(48px,6.4vw,100px);line-height:1;letter-spacing:-.04em">היופי שלך.<br>בדיוק שלך.</h1>
        <p style="margin:0;max-width:420px;font-size:17px;line-height:1.7;color:#6E5F64;font-weight:300">קליניקת בוטיק לאיפור קבוע ואסתטיקה מתקדמת, לצד אקדמיה מקצועית להכשרת הדור הבא של נשות המקצוע.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <a href="#" style="height:52px;padding:0 28px;border-radius:999px;background:#1F1A1C;color:#FFFFFF;font-size:15px;display:flex;align-items:center">גלי את הטיפולים</a>
          <a href="#" style="height:52px;padding:0 24px;border-radius:999px;background:#FFFFFF;color:#1F1A1C;font-size:15px;display:flex;align-items:center">האקדמיה</a>
        </div>
      </div>
      <div style="position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:#EBD9DA;color:#9B8086"><image-slot id="dirC-hero" shape="rounded" radius="28" placeholder="צילום ראשי"></image-slot></div>
    </section>
  </div>

  <section style="max-width:1360px;margin:0 auto;padding:100px 14px">
    <h2 style="margin:0 0 36px;font-weight:300;font-size:clamp(32px,3.6vw,48px);letter-spacing:-.03em">טיפולים</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
      <div style="border-radius:28px;background:#F8EEEE;padding:12px;display:flex;flex-direction:column;gap:12px"><div style="aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#EBD9DA;color:#9B8086"><image-slot id="dirC-t1" shape="rounded" radius="20" placeholder="הדמיית שיער"></image-slot></div><span style="padding:4px 8px 8px;font-size:16px">הדמיית שיער בגבות</span></div>
      <div style="border-radius:28px;background:#F8EEEE;padding:12px;display:flex;flex-direction:column;gap:12px"><div style="aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#EBD9DA;color:#9B8086"><image-slot id="dirC-t2" shape="rounded" radius="20" placeholder="פודרה"></image-slot></div><span style="padding:4px 8px 8px;font-size:16px">פודרה ושיטה משולבת</span></div>
      <div style="border-radius:28px;background:#F8EEEE;padding:12px;display:flex;flex-direction:column;gap:12px"><div style="aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#EBD9DA;color:#9B8086"><image-slot id="dirC-t3" shape="rounded" radius="20" placeholder="הסרה בלייזר"></image-slot></div><span style="padding:4px 8px 8px;font-size:16px">הסרה בלייזר</span></div>
      <div style="border-radius:28px;background:#F8EEEE;padding:12px;display:flex;flex-direction:column;gap:12px"><div style="aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#EBD9DA;color:#9B8086"><image-slot id="dirC-t4" shape="rounded" radius="20" placeholder="אסתטיקה"></image-slot></div><span style="padding:4px 8px 8px;font-size:16px">אסתטיקה מתקדמת</span></div>
    </div>
  </section>

  <section style="max-width:1360px;margin:0 auto;padding:0 0 50px">
    <div style="border-radius:32px;background:#1F1A1C;color:#FFFFFF;padding:80px 32px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center">
      <h2 style="margin:0;font-weight:300;font-size:clamp(34px,4.6vw,64px);letter-spacing:-.04em">כל יופי מתחיל בדיוק.</h2>
      <a href="#" style="height:52px;padding:0 30px;border-radius:999px;background:#F8EEEE;color:#1F1A1C;font-size:15px;display:flex;align-items:center">בואי נדבר</a>
    </div>
  </section>
</div>
</x-dc>
</body>
</html>
